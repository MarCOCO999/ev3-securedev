groups:
  - name: ev3-seguridad
    rules:
      - alert: AplicacionCaida
        expr: up{job="ev3-app"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "La aplicación ev3-app no responde"
          description: "Prometheus no puede obtener métricas de ev3-app hace más de 30 segundos."

      - alert: PosibleAtaqueDetectado
        expr: sum by (attack_type) (increase(suspicious_requests_total[1m])) > 5
        labels:
          severity: high
        annotations:
          summary: "Posible ataque {{ $labels.attack_type }} en curso"
          description: "Más de 5 solicitudes con patrón {{ $labels.attack_type }} en el último minuto."

      - alert: TasaAltaDeErrores4xx
        expr: sum(rate(flask_http_request_total{status=~"4.."}[1m])) > 1
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "Alta tasa de errores 4xx (posible escaneo o fuerza bruta)"
          description: "Más de 1 respuesta 4xx por segundo durante 30 segundos."

      - alert: ErroresDelServidor5xx
        expr: sum(increase(flask_http_request_total{status=~"5.."}[1m])) > 0
        labels:
          severity: high
        annotations:
          summary: "La aplicación está devolviendo errores 5xx"
          description: "Se registraron errores internos del servidor en el último minuto."
