global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: ev3-app
    metrics_path: /metrics
    static_configs:
      - targets: ["ev3-app:5000"]
        labels:
          environment: produccion

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
